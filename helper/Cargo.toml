[package]
name = "dsh-llm-ustc-helper"
version = "0.3.0"
edition = "2024"
license = "MIT"

[dependencies]
aes = "0.8"
anyhow = "1"
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
futures-util = "0.3"
md-5 = "0.10"
rand = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots", "socks", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
smoltcp = { version = "0.14", default-features = false, features = ["std", "medium-ip", "proto-ipv4", "socket-tcp"] }
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
